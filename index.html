<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Check</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0 12px 30px;
  background: #edf1f5;
  font-family: Arial, sans-serif;
  color: #25364a;
}

/* Top Home bar */
.top-home {
  background: #2b5d91;
  text-align: center;
  padding: 18px;
  margin: 0 -12px 35px;
  box-shadow: 0 4px 12px #00000020;
}

.top-home a {
  color: white;
  text-decoration: none;
  font-size: 22px;
  font-weight: bold;
}

/* Demo notice */
.notice {
  max-width: 560px;
  margin: 0 auto 20px;
  padding: 13px 10px;
  background: #dceaff;
  color: #164da5;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  border-radius: 8px;
  line-height: 1.5;
}

/* Main card */
.card {
  max-width: 560px;
  margin: auto;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 28px #00000012;
}

/* Purple title */
.header {
  background: linear-gradient(100deg, #7622a7, #a21bc0);
  color: white;
  padding: 22px 14px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}

/* Detail rows */
.item {
  display: grid;
  grid-template-columns: 43% 57%;
  gap: 5px;
  padding: 21px 16px;
  border-bottom: 1px solid #e1e5e9;
  overflow-wrap: anywhere;
  line-height: 1.5;
  min-height: 78px;
}

.label {
  font-weight: bold;
}

.value {
  color: #71808d;
}

.status {
  min-height: 125px;
}

/* Buttons */
.actions {
  text-align: center;
  padding: 28px 18px 32px;
}

button {
  width: 80%;
  max-width: 300px;
  padding: 17px 12px;
  border: none;
  border-radius: 40px;
  background: #20277f;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #303caa;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #f0a500;
  outline-offset: 3px;
}

.message {
  color: #536273;
  font-size: 14px;
  margin-top: 14px;
}

@media (max-width: 380px) {
  .item {
    grid-template-columns: 42% 58%;
    padding: 18px 12px;
    font-size: 14px;
  }

  .header {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<!-- Home at the top -->
<div class="top-home">
  <a href="./">Home</a>
</div>

<div class="notice">
  DEMO — NOT AN OFFICIAL VISA CHECK
</div>

<main class="card">
  <div class="header">Check Status</div>

  <div class="item">
    <span class="label">Application ID</span>
    <span class="value" id="appId">DEMO-12345</span>
  </div>

  <div class="item">
    <span class="label">Name</span>
    <span class="value">SAMPLE USER</span>
  </div>

  <div class="item">
    <span class="label">Nationality</span>
    <span class="value">DEMO ONLY</span>
  </div>

  <div class="item">
    <span class="label">Passport Number</span>
    <span class="value">XX0000000</span>
  </div>

  <div class="item status">
    <span class="label">Status</span>
    <span class="value">
      Sample status — no real record
    </span>
  </div>

  <div class="actions">
    <button type="button" onclick="refreshPage()">
      REFRESH
    </button>

    <p class="message" id="message" aria-live="polite"></p>
  </div>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

function validId(value) {
  return value && /^[a-zA-Z0-9-]{1,30}$/.test(value);
}

document.getElementById("appId").textContent =
  validId(id) ? id : "DEMO-12345";

function refreshPage() {
  // Reloads the page and keeps the current URL and ID.
  window.location.reload();
}
</script>

</body>
</html>
